envelope:
  media_type: application/json
  shape:
    status: integer — HTTP status code, repeated inside the body
    error: boolean — true on failure; absent on the success envelope
    errorDetails:
      summary: string — human-readable message
  success_shape:
    status: integer
    message: string
    data: string|object — payload
  observations:
  - The envelope duplicates the HTTP status code in the body, which is an
    anti-pattern RFC 9457 explicitly avoids.
  - No type URI, no title/detail/instance fields, no machine-readable error code —
    an agent cannot branch on anything but the status integer and a prose summary.
  - Content type is application/json, not application/problem+json.
problems:
