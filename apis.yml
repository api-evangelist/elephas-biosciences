apis:
- aid: elephas-biosciences-portal-api
  name: Elephas Portal API
  description: 'The private backend API behind the Elephas Portal, the secure
    cloud-based web application through which clinicians, laboratories and research
    partners receive elive test reports and manage specimen registration. Probed
    live at https://portal.elephasapis.com: an ASP.NET Core (Kestrel) service that
    answers every path — including /swagger and /swagger/v1/swagger.json — with HTTP
    401 and a WWW-Authenticate: Bearer challenge. Bearer tokens are issued by Azure
    AD B2C on the company-controlled host na.login.elephas.com. No public OpenAPI,
    reference or developer program is published; the observed surface (registration,
    security, histology, cytokines, cut-culture resources) is inferred only from the
    portal single-page application bundle and is recorded here as evidence of an API
    that exists but is not publicly documented.'
