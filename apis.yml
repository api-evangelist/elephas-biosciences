aid: elephas-biosciences
name: Elephas Biosciences
description: 'Elephas Biosciences Corporation is a Madison, Wisconsin precision-oncology
  company that builds elive, a first-in-class functional immune-profiling platform
  that measures how a patient''s own live tumor tissue responds to immunotherapy. The
  platform combines elive Edge (an automated instrument that cuts core-needle biopsies
  into uniform 300-micron viable fragments), elive Gel (a proprietary hydrogel that
  preserves the native tumor microenvironment) and the elive Method (a sequential
  treatment and cytokine-analysis strategy) to return a functional response readout
  within roughly 72 hours of biopsy. Clinicians receive elive test reports through a
  secure, cloud-based web application; researchers and drug developers receive custom
  reports plus raw data for in-house analysis. The company raised a $40M Series B-2
  in November 2025 to commercialize elive as a laboratory developed test. Its digital
  surface is the Elephas Portal (portal.elephas.com), an Angular single-page
  application backed by an ASP.NET Core API at portal.elephasapis.com that is
  authenticated with Azure AD B2C on the company-controlled na.login.elephas.com
  identity host. No public developer program, API reference or machine-readable
  contract is published.'
